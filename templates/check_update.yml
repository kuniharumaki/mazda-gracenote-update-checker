name: Gracenote Update Checker

on:
  schedule:
    # 毎週金曜日 17:00 (JST) = 8:00 (UTC) に実行
    - cron: '0 8 * * 5'

  workflow_dispatch: # GitHub UIからの手動実行も許可

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gracenote Checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python check_gracenote.py

      - name: Auto-commit updated state.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(state): update Gracenote version state [skip ci]"
          file_pattern: "state.json"
